[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-space-autojoin"
version = "0.1.0"
description = "Join local Matrix users to child rooms when they join a managed Space"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["matrix-synapse>=1.109.0,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
